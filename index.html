<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victor — National College of Ireland</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-color: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 540px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-color), #bc8cff);
        }

        .date-badge {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--accent-color);
            background-color: var(--accent-glow);
            padding: 0.35rem 0.8rem;
            border-radius: 20px;
            margin-bottom: 1.5rem;
            letter-spacing: 0.03em;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 400;
            margin-bottom: 2rem;
        }

        .divider {
            height: 1px;
            background-color: var(--border-color);
            margin-bottom: 1.75rem;
            width: 100%;
        }

        .problem-statement {
            font-size: 1rem;
            color: var(--text-primary);
            line-height: 1.7;
        }

        .problem-label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
            }
            h1 {
                font-size: 1.85rem;
            }
        }
    </style>
</head>
<body>

    <main class="container">
        <div class="card">
            <div id="date-display" class="date-badge">Loading date...</div>
            
            <h1>Victor</h1>
            <p class="subtitle">MSc student, National College of Ireland</p>
            
            <div class="divider"></div>
            
            <div class="problem-statement">
                <span class="problem-label">Focus Area</span>
                I care deeply about closing the friction gap between autonomous AI capabilities and organizational trust so enterprises can safely adopt scalable decision systems.
            </div>
        </div>
    </main>

    <script>
        (function() {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            const today = new Date();
            const formattedDate = today.toLocaleDateString('en-US', options);
            document.getElementById('date-display').textContent = formattedDate;
        })();
    </script>
</body>
</html>
